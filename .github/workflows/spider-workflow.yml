name: Spider Workflow

on:
  workflow_dispatch:
  schedule:
    # Run every 4 days at midnight
    - cron: '0 0 */4 * *'   

permissions:
  contents: write

concurrency:
  group: repacks-data-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: List files
        run: ls -R | sed -e 's/:$//' -e 's/[^-][^\/]*\//--/g' -e 's/^/   /' -e 's/-/|/'

      - name: Install dependencies and run spider
        run: |
          cd ./spider
          pip install -r requirements.txt
          python spider.py

      - name: Commit changes
        if: ${{ success() }}
        run: |
          git config --global user.email "Cvandia@users.noreply.github.com"
          git config --global user.name "Cvandia"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Add scraped data"
            git push origin HEAD:master
          fi
